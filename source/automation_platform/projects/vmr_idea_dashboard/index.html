<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VMR Idea Forest — 科研热点追踪</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./echarts.min.js"></script>
  </head>
  <body>
    <!-- 全局导航栏 -->
    <nav id="globalNav" class="global-nav hidden">
      <a class="nav-brand" href="#" data-nav="forest">VMR Idea Forest</a>
      <div class="nav-links">
        <button class="nav-link active" data-nav="forest">Idea 森林</button>
        <button class="nav-link" data-nav="dashboard">分析仪表盘</button>
      </div>
    </nav>

    <div id="app" class="app-shell">
      <div class="loading-screen">
        <span class="loading-orb"></span>
        <p>正在唤醒 Idea Forest...</p>
      </div>
    </div>

    <!-- 仪表盘容器 -->
    <div id="dashboardPanel" class="dashboard-panel hidden">
      <div class="dashboard-grid">
        <div class="chart-card" id="chartPie"><div class="chart-loader">加载中...</div></div>
        <div class="chart-card" id="chartRadar"><div class="chart-loader">加载中...</div></div>
        <div class="chart-card" id="chartLine"><div class="chart-loader">加载中...</div></div>
        <div class="chart-card" id="chartBar"><div class="chart-loader">加载中...</div></div>
      </div>
    </div>

    <!-- 论文详情页容器 -->
    <div id="paperPage" class="paper-page hidden"></div>

    <script src="./app.js"></script>
  </body>
</html>
